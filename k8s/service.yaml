apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  # NodePort keeps it reachable on a local cluster (minikube / kind / Docker Desktop).
  # Switch to ClusterIP behind an Ingress, or LoadBalancer on a cloud cluster.
  type: NodePort
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
